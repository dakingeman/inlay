<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="inlay.css">
<script src="../../design/tokens.js"></script><script src="parts.js"></script><script src="backdrop.js"></script>
<!-- Hero L13-3 "Macro", animated (31 Oct 2026): starts on the highlighted key so close it fills the frame, A presses it,
     the camera pulls back to the whole keyboard, the name fades in above, then it pushes back in. The keyboard is drawn
     as shapes so it stays sharp at any zoom. window.at(t) sets the frame for time t (seconds); the loop is LOOP s. -->
<style>
.abs{position:absolute}
#world{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.k{position:absolute;border-radius:14px;background:#1C1E23;display:flex;align-items:center;justify-content:center;font-family:R;font-weight:500;color:#E9EAEE}
.k.on{background:var(--teal);color:#0B0C0E;box-shadow:0 0 0 4px rgba(111,211,227,.25)}
.panel{position:absolute;border-radius:26px;background:#0A0B0D;box-shadow:0 0 0 2px var(--track),0 24px 60px rgba(0,0,0,.45)}
</style></head><body>
<div id="c" class="canvas" style="width:1600px;height:900px"><div id="world"></div><div id="logo" class="abs" style="left:0;top:110px;width:1600px;display:flex;justify-content:center"><img src="../brand/inlay-lockup-clear-dark.svg" style="height:120px"></div></div>
<script>
const LOOP=6.0, u=96, gap=10, ROWS=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l',"'"],['⇧','z','x','c','v','b','n','m','⌫'],['?123',',','English','.','↵']];
const WID={'⇧':1.5,'⌫':1.5,'?123':1.5,'English':5,'↵':1.5};
const KX=(1600-10*u)/2, KY=370;          // where the keyboard sits when fully in view
let html=`<div class="panel" style="left:${KX-22}px;top:${KY-22}px;width:${10*u+44-gap}px;height:${4*u+44-gap}px"></div>`, target=null;
ROWS.forEach((row,r)=>{ let x=KX; row.forEach(k=>{ const w=(WID[k]||1)*u-gap, on=k==='i';
  html+=`<div class="k${on?' on':''}" id="${on?'key':''}" style="left:${x}px;top:${KY+r*u}px;width:${w}px;height:${u-gap}px;font-size:${k.length>1?28:40}px;${k==='English'?'color:#6B6F78':''}">${k}</div>`;
  if(on) target={x:x+w/2,y:KY+r*u+(u-gap)/2,w};
  x+=(WID[k]||1)*u; }); });
document.getElementById('world').innerHTML=html;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, cl=(a,b,t)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
// zoom 1 = keyboard in view; Z = the key fills ~60 % of the frame height
const Z=900*0.62/(u-gap);
window.at=t=>{ t=((t%LOOP)+LOOP)%LOOP;
  // 0–0.9 close and still · press at 0.45 · pull back 0.9–2.8 · hold · push in 4.7–6.0 (lands where it started)
  const out=ease(cl(0.9,2.8,t)), back=ease(cl(4.7,6.0,t)), k=out*(1-back);
  const z=Math.exp(Math.log(Z)*(1-k));               // zoom evenly in log space, so it feels like a camera move
  const cx=target.x+(800-target.x)*k, cy=target.y+(450+70-target.y)*k;   // the point at the frame's centre
  const w=document.getElementById('world'); w.style.transform=`translate(${800-cx*z}px,${450-cy*z}px) scale(${z})`;
  const p=t>0.45&&t<0.75?1-0.08*Math.sin(Math.PI*(t-0.45)/0.3):1;          // the press: down 8 % and back
  document.getElementById('key').style.transform=`scale(${p})`;
  document.getElementById('logo').style.opacity=ease(cl(2.2,3.0,t))*(1-ease(cl(4.5,5.0,t)));
};
document.fonts.ready.then(()=>{ inlayBackdrop(document.getElementById('c'),'macro',0,{motif:'none',grain:false});
  // the backdrop is painted into the canvas; keep the world and the logo above it
  document.getElementById('world').style.zIndex=1; document.getElementById('logo').style.zIndex=2; at(0); document.title='done'; });
</script></body></html>
