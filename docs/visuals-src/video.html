<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="inlay.css">
<script src="../../design/tokens.js"></script><script src="parts.js"></script><script src="backdrop.js"></script><script src="renders/video-devices.js"></script><script src="renders/logo-anim.js"></script>
<style>
/* The launch videos (teaser and What's new): the README's look, in motion. Rules: VISUAL_SYSTEM.md §10 */
.abs{position:absolute}
.cap{position:absolute}
.cap .h1{font-size:76px}
.cap .body{font-size:32px;margin-top:20px;color:#C9CCD3}
.win{border-radius:20px;overflow:hidden;background:#0A0B0D;box-shadow:0 0 0 2px var(--track);box-sizing:border-box}
.screen{border-radius:20px!important;box-shadow:0 0 0 2px var(--track)!important}   /* the hero window's edge, no drop shadow */
.shot{position:absolute;border-radius:20px;box-shadow:0 0 0 2px var(--track);overflow:hidden;background:#000}
.shot img{display:block;width:100%;height:100%}
.devname{position:absolute;font-family:I;font-size:28px;color:var(--paper);text-align:center}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tag{font-family:I;font-weight:600;letter-spacing:.14em;font-size:24px;color:var(--teal);padding:10px 22px;border-radius:999px;box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--teal) 75%, transparent)}
</style></head><body>
<div id="c" class="canvas" style="width:1920px;height:1080px">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="glow" class="abs" style="inset:0;pointer-events:none"></div>
  <div id="scene"></div>
  <div id="fin" class="abs" style="inset:0;pointer-events:none"></div>
</div>
<script>
const W=1920,H=1080, Q=new URLSearchParams(location.search), GRAIN=Q.get('grain')!=='0';
// Round V6 (31 Oct 2026) options: sub = subline style (a 32 px grey, b 36 px brighter), combo = where a pressed shortcut is
// spelled out ('field' in the text box, 'below' under the window, 'none'), motion ('none', 'push' a slow 2.5 % push-in,
// 'drift' the backdrop's light drifting), centre = devices centred on one point (true) or set against the right edge
window.OPT=Object.assign({sub:'b',combo:'field',motion:'drift',centre:true,end:'A',tag:'A'},JSON.parse(Q.get('opt')||'{}'));
// Captions: one idea each, a real person's words, at most about seven words. {K} = a button badge (the README's own).
const CAPS={
  buttons:['Every button has a job','{Y} is space, {X} deletes, {START} sends.'],
  copy:['Select, copy and paste','{SELECT} starts selecting, {R1} adds a word.'],
  clips:['Select, copy and paste','{SELECT} starts selecting, {R1} adds a word.'],
  undo:['Undo with {R2} + {X}','Deleted too much? Bring it back.'],
  holdrt:['Hold {R2} for more','Shortcuts show on the keys while you hold it.'],
  words:['Word suggestions that learn','Press {R3} for the first one. Your games come first.'],
  accents:['Hold {A} for accents','Move to the one you want and let go.'],
  devices:['Made for what you hold','Controllers, handhelds and TV remotes.'],
  auto:['Knows your handheld by name','Automatic recognises the AYN Odin and more.'],
  sounds:['Nine sound packs, all remade','Each one types its own name.'],
  packrow:['Nine sound packs, all remade','Step through them in Settings → Sound & haptics.'],
  colour:['Your own highlight colour','Colour, Strength and Brightness.'],
  tourlook:['The tour follows your colour','So does What’s new.'],
  tv:['TV mode','A big line you can read from the sofa.'],
  settings:['Settings made for the controller','{L1} and {R1} switch tabs. {Y} shows the keyboard.'],
};
// the TV demo app's titles (series and films, as in the README's TV image)
const TVLIST=[{name:'Stranger Things',plat:'SERIES'},{name:'Station Eleven',plat:'SERIES'},{name:'Star Wars',plat:'FILM'},{name:'Severance',plat:'SERIES'},{name:'Spirited Away',plat:'FILM'}]
  .map((g,i)=>Object.assign(g,{tone:COVER_TONES[(i+3)%9],i:i+3}));
const TVPOP=[{name:'The Bear',plat:'SERIES'},{name:'Dune',plat:'FILM'},{name:'Arcane',plat:'SERIES'},{name:'Shōgun',plat:'SERIES'},{name:'Paddington 2',plat:'FILM'},{name:'Blue Eye Samurai',plat:'SERIES'},{name:'Up',plat:'FILM'}]
  .map((g,i)=>Object.assign(g,{tone:COVER_TONES[i%9],i}));
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const LOGO=h=>`<img class="m" src="hero-parts/lockup-clear.svg" style="display:block;height:${h}px">`;
let bgKey='';
// The backdrop: README rules, one variation per part of the video (index = its place), never the motif. Finish on top.
function backdrop(id,index){
  const k=id+index; if(k===bgKey) return; bgKey=k;
  document.getElementById('bg').style.background=inlayBackground(id,index,W,H);
  document.getElementById('fin').innerHTML=`<div class="abs" style="inset:0;background:radial-gradient(${Math.round(W*.94)}px ${Math.round(H*1.05)}px at 50% 46%, rgba(0,0,0,0) 58%, rgba(0,0,0,.24) 100%)"></div>`+
    (GRAIN?`<svg width="${W}" height="${H}" style="position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="${W}" height="${H}" filter="url(#n)"/></svg>`:'');
}
// A part's words: its own title / sub from the plan, or the defaults in CAPS for its scene
const words=(k,o)=>o&&o.title?[o.title,o.sub||'']:CAPS[k];
// Button names drawn as the app's badges, as tall as 1.42 x the line's capitals and centred on them (as in the README)
const CAP=.7;   // Atkinson / Inter capital height ÷ font size
const richen=(t,fs)=>t.replace(/\{(\w+)\}/g,(m,k)=>{ const h=Math.round(fs*CAP*1.42); return `<img src="renders/btn-xbox-${k}.png" style="height:${h}px;vertical-align:${((fs*CAP-h)/2).toFixed(1)}px;margin:0 ${(fs*.06).toFixed(1)}px">`; });
// Words arrive like the end card's lines: each fades in while rising 16 px, 0.5 s, ease-out; the subline 0.25 s later
const rise=(sec,d)=>{ if(sec===undefined) return ''; const t=ease((sec-d)/.5); return `opacity:${t};transform:translateY(${((1-t)*16).toFixed(1)}px)`; };
function capBlock(c,sec,o={}){ const out=o.left!==undefined&&o.left<.3?ease(1-o.left/.3):0;
  return `<div class="m" style="${o.w?`width:${o.w}px;`:''}${out?`transform:translateY(${(-10*out).toFixed(1)}px)`:''}"><div class="h1" style="font-size:76px;white-space:nowrap;${rise(sec,0)}">${richen(esc(c[0]),76)}</div>
  ${c[1]?(()=>{ const fs=OPT.sub==='b'?36:32, col=OPT.sub==='b'?'#E3E6EB':'#C9CCD3'; return `<div class="body" style="font-size:${fs}px;margin-top:${OPT.sub==='b'?16:18}px;color:${col};${OPT.sub==='b'?'font-weight:500;':''}white-space:nowrap;${rise(sec,.25)}">${richen(esc(c[1]),fs)}</div>`; })():''}</div>`; }
const settle=async()=>{await Promise.all([...document.images].map(i=>i.complete?0:i.decode().catch(()=>{})));};

// ---- The keyboard scenes (31 Oct 2026, round V5): the README hero's window, big, with the words and the device above it ----
// One grid for every keyboard scene, so the window never moves between them: the words on the left, the device slot on the
// right (its right edge on the window's), the window 1520 px wide underneath.
const WW=1520, WX=(W-WW)/2, SW=460, SH=208, ROW=134, GAPV=56, WY=ROW+SH+GAPV;
// The device slot rule (VISUAL_SYSTEM.md §10): every device looks the same size whichever one a scene shows (about
// 200 px tall, face buttons 21-24 px). Whole when it fills 60 % of the slot's width with face buttons of 18 px or more;
// otherwise (the tall ones) zoomed so a face button is 24 px, the controls in the middle, never past the body's end, and
// every cut edge fading out over 22 %. Measured from the app's own drawing (renders/video-devices.js) and mapped onto the
// recorded picture by the body's box (pic-boxes.py), so the lit buttons are exactly the app's.
const FILL=.6, MIN=18, ZOOM=24, FADE=.22, PAD=4, SHOULDERS=['LB','RB','LT','RT'];
const unitBox={};
function bodyUnits(dev){ if(unitBox[dev]) return unitBox[dev]; return unitBox[dev]=new Promise(res=>{ const t=VDEV[dev].svg, vb=t.match(/viewBox="([^"]+)"/)[1].split(/\s+/).map(Number), S=2, img=new Image();
  img.onload=()=>{ const cv=document.createElement('canvas'); cv.width=vb[2]*S; cv.height=vb[3]*S; const g=cv.getContext('2d'); g.drawImage(img,0,0,cv.width,cv.height);
    const a=g.getImageData(0,0,cv.width,cv.height).data, on=(x,y)=>a[(y*cv.width+x)*4+3]>160, rows=[]; for(let y=0;y<cv.height;y++){ let r=false; for(let x=0;x<cv.width;x++) if(on(x,y)){r=true;break;} rows.push(r); }
    let runs=[],y=0; while(y<rows.length){ if(rows[y]){ const s0=y; while(y<rows.length&&rows[y]) y++; runs.push([s0,y]); } y++; }
    const [t0,b0]=runs.reduce((m,r)=>r[1]-r[0]>m[1]-m[0]?r:m); let l=1e9,r=-1; for(let yy=t0;yy<b0;yy++) for(let x=0;x<cv.width;x++) if(on(x,yy)){ l=Math.min(l,x); r=Math.max(r,x); }
    res({l:vb[0]+l/S,t:vb[1]+t0/S,r:vb[0]+(r+1)/S,b:vb[1]+b0/S}); };
  img.onerror=()=>res(null);
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t.replace(/<svg([^>]*?) width="[^"]+" height="[^"]+"/,'<svg$1 width="'+vb[2]*S+'" height="'+vb[3]*S+'"')); }); }
// where a recorded picture goes: px = the picture's body box (frame pixels), returns the img's size and place in the slot
async function slotPlace(dev,px,fullPx){
  const U0=await bodyUnits(dev), geo=VDEV[dev].geo, face=geo.A||geo.OK, s=(px[2]-px[0])/(U0.r-U0.l);           // frame px per drawing unit
  // shoulder keys the scene uses float above the body: the device keeps its size and the slot grows upwards to show them
  const up=fullPx&&fullPx[1]<px[1]?(px[1]-fullPx[1])/s:0, U=U0;
  const ctl=Object.entries(geo).filter(([k,v])=>v&&v.w&&!SHOULDERS.includes(k)).map(([k,v])=>v);
  const C={l:Math.min(...ctl.map(v=>v.x)),t:Math.min(...ctl.map(v=>v.y)),r:Math.max(...ctl.map(v=>v.x+v.w)),b:Math.max(...ctl.map(v=>v.y+v.h))};
  const bw=U.r-U.l, bh=U.b-U.t, kFit=Math.min((SW-2*PAD)/bw,(SH-2*PAD)/bh), whole=bw*kFit>=FILL*SW&&face.w*kFit>=MIN, k=whole?kFit:ZOOM/face.w;
  const vw=SW/k, vh=SH/k; let x0,y0;
  if(whole){ x0=OPT.centre?(U.l+U.r)/2-vw/2:U.r+PAD/k-vw; y0=(U.t+U.b)/2-vh/2; }
  else { x0=(C.l+C.r)/2-vw/2; y0=(C.t+C.b)/2-vh/2;
    const m=PAD/k; x0=bw+2*m<=vw?(OPT.centre?(U.l+U.r)/2-vw/2:U.r+m-vw):Math.max(U.l-m,Math.min(U.r+m-vw,x0)); y0=bh+2*m<=vh?(U.t+U.b)/2-vh/2:Math.max(U.t-m,Math.min(U.b+m-vh,y0)); }   // a cut-off device still keeps 4 px of room at the end it shows
  const cut={top:y0>U.t-.5,bottom:y0+vh<U.b+.5,left:x0>U.l-.5,right:x0+vw<U.r+.5};
  const z=k/s;                                                                                       // frame px -> screen px
  const ux=x=>px[0]+(x-U.l)*s, uy=y=>px[1]+(y-U0.t)*s;                                               // drawing units -> frame px
  const f=FADE*100, mv=`linear-gradient(to bottom,${cut.top?`transparent 0,#000 ${f}%`:'#000 0'},${cut.bottom?`#000 ${100-f}%,transparent 100%`:'#000 100%'})`,
        mh=`linear-gradient(to right,${cut.left?`transparent 0,#000 ${f}%`:'#000 0'},${cut.right?`#000 ${100-f}%,transparent 100%`:'#000 100%'})`;
  const extra=Math.ceil(up*k);
  return {z, left:-ux(x0)*z, top:-uy(y0)*z+extra, extra, mask:mv+','+mh, whole, facePx:face.w*k};
}
// the hero's window: the field (the app's text, its selection and the cursor) and the keyboard as the app drew it
function windowHtml(f,o,ww,kbw,kbh){ const p=Math.round(ww*.016), fh=Math.round(ww*.064), fs=Math.round(ww*.030), g=Math.round(ww*.011), ch=Math.round(fs*1.18);
  const cur=`<span style="display:inline-block;width:0;height:${ch}px;vertical-align:${-Math.round(ch*.2)}px;position:relative"><span style="position:absolute;left:-1px;top:0;width:4px;height:${ch}px;border-radius:2px;background:var(--teal);visibility:${o.curOn===false?'hidden':'visible'}"></span></span>`;
  const sel=f.sel?`<span style="background:color-mix(in srgb, var(--teal) 32%, transparent);border-radius:6px;box-shadow:0 0 0 4px color-mix(in srgb, var(--teal) 32%, transparent)">${esc(f.sel)}</span>`:'';
  const fld=o.noField?'':`<div class="field" style="position:relative;height:${fh}px;font-size:${fs}px;padding:0 ${Math.round(ww*.022)}px;white-space:pre">${esc(f.before)}${sel}${cur}${esc(f.after||'')}${o.pill&&OPT.combo==='field'?`<div style="position:absolute;right:${Math.round(ww*.012)}px;top:50%;transform:translateY(-50%)">${o.pill}</div>`:''}</div>`;
  return `<div class="win m" style="position:absolute;left:${(W-ww)/2}px;top:${WY}px;width:${ww}px;padding:${p}px ${p}px ${o.noField?p:0}px">${fld}
    <img src="${o.kb}" style="width:${ww-2*p}px;height:${Math.round((ww-2*p)*kbh/kbw)}px;margin-top:${o.noField?0:g}px;display:block"></div>`; }
// A pressed shortcut, spelled out: the buttons as badges and what they did, rising in (0.15 s) and fading out (0.25 s)
function pillHtml(combo,age,left){ if(!combo) return ''; const fs=30, t=Math.min(ease(age/.15),left===undefined?1:Math.min(1,left/.25));
  return `<div style="display:inline-flex;align-items:center;gap:14px;height:64px;padding:0 26px;border-radius:32px;background:#202228;box-shadow:0 0 0 2px var(--track);font-family:I;font-weight:500;font-size:${fs}px;color:var(--paper);white-space:nowrap;opacity:${t};transform:translateY(${((1-t)*8).toFixed(1)}px)">
    <span>${richen(esc(combo[0]).replace(/ \+ /g,' <span style="color:#9A9DA5">+</span> '),fs)}</span><span style="color:#C9CCD3">${esc(combo[1])}</span></div>`; }
const winHeight=(ww,kbw,kbh,noField)=>{ const p=Math.round(ww*.016); return p+(noField?p:Math.round(ww*.064)+Math.round(ww*.011))+Math.round((ww-2*p)*kbh/kbw); };
const natural=src=>new Promise(r=>{ const i=new Image(); i.onload=()=>r([i.naturalWidth,i.naturalHeight]); i.src=src; });
// A little life (round V6 options): 'push' moves in 2.5 % over a part; 'drift' moves the backdrop's light very slowly
const easeIO=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function motion(o){ const sc=document.getElementById('scene'), bg=document.getElementById('bg');
  sc.style.transformOrigin='50% 50%'; sc.style.transform=(OPT.motion==='push'||OPT.motion==='both')&&o.dur?`scale(${(1+.025*easeIO((o.sec||0)/o.dur)).toFixed(5)})`:'';
  // drift (31 Oct, Emre: make it more apparent, playful): a second pool of the backdrop's own whisper colour wanders over
  // the top of the frame on a slow figure-of-eight (about 14 s round), so the light visibly moves without anything bright
  const gl=document.getElementById('glow');
  if(OPT.motion==='drift'||OPT.motion==='both'){ const g=(o.gsec||0), x=50+34*Math.sin(g*.45), y=8+16*Math.sin(g*.9+.6), x2=50-30*Math.sin(g*.33+1.4), y2=96+8*Math.cos(g*.5);
    gl.style.background=`radial-gradient(1150px 700px at ${x.toFixed(2)}% ${y.toFixed(2)}%, oklch(0.32 0.05 224.6 / .55), oklch(0.32 0.05 224.6 / 0) 70%),`+
      `radial-gradient(900px 520px at ${x2.toFixed(2)}% ${y2.toFixed(2)}%, oklch(0.27 0.04 250 / .35), oklch(0.27 0.04 250 / 0) 70%)`; }
  else gl.style.background=''; }

// The no-crop guard (31 Oct 2026, Emre: buttons and logos must never be cut off): after every frame is laid out, every
// button badge and logo must sit fully inside the frame and inside every box above it that hides overflow. Any that
// doesn't is reported, and render-video.js stops the render.
window.CROPS=[];
function cropCheck(){ const sel=[...document.querySelectorAll('#scene img[src*="btn-"], #scene img[src*="badge-"], #scene img[src*="lockup"], #scene svg[viewBox]')];
  for(const el of sel){ if(el.closest('#slot')) continue; const r=el.getBoundingClientRect(); if(r.width<1) continue;
    const tol=.5; let p=el.parentElement, bad=r.left<-tol||r.top<-tol||r.right>W+tol||r.bottom>H+tol?'the frame':'';
    while(!bad&&p&&p.id!=='c'){ const cs=getComputedStyle(p); if(cs.overflow!=='visible'||cs.overflowX!=='visible'||cs.overflowY!=='visible'){ const q=p.getBoundingClientRect();
        if(r.left<q.left-tol||r.top<q.top-tol||r.right>q.right+tol||r.bottom>q.bottom+tol) bad='a box that hides overflow'; } p=p.parentElement; }
    if(bad) CROPS.push((el.getAttribute('src')||'logo').split('/').pop()+' cut by '+bad); } }
window.Stage=async function(o){
  backdrop(o.part,o.index);
  const f=o.frame, tv=o.scene==='tv', [kw,kh]=await natural(o.kb), [pw]=await natural(o.pic);
  // the window is 1520 px wide; a taller keyboard (TV mode) gets a narrower window, so it still ends 72 px above the edge
  let ww=WW;
  const c=words(f.cap,o), sp=await slotPlace(f.dev,o.box,o.full);
  // TV mode draws its own panel (its big line, the keys, its own edge), so it is shown as it is, trimmed to that panel
  let h;
  if(tv){ // TV mode as it looks on a TV (31 Oct, Emre): a 16:9 screen in a thin bezel, the TV demo app's Search page filling
    // it, and the TV keyboard floating over the lower half with a soft shadow, as the app shows it
    const typed=f.before||'', res=TVLIST.filter(t=>t.name.toLowerCase().startsWith(typed.toLowerCase()));
    const th=H-56-WY, tw=Math.round(th*16/9), bz=10, iw=tw-2*bz, ih=th-2*bz, u=iw/1100;
    const [x0,y0,x1,y1]=o.kbBox||[0,0,kw,kh], pw2=x1-x0, ph2=y1-y0, kz=iw*.58/pw2, kbw2=pw2*kz, kbh2=ph2*kz;
    const posters=covers(res.length?res:[],{w:Math.round(118*u),gap:Math.round(18*u),title:Math.round(14*u),plat:Math.round(10*u),max:5});
    h=`<div class="m" style="position:absolute;left:${(W-tw)/2}px;top:${WY}px;width:${tw}px;height:${th}px;border-radius:18px;background:#050607;box-shadow:0 0 0 2px var(--track)">
      <div style="position:absolute;left:${bz}px;top:${bz}px;width:${iw}px;height:${ih}px;border-radius:8px;overflow:hidden;background:#0D0F13">
        <div style="position:absolute;left:${Math.round(48*u)}px;top:${Math.round(34*u)}px" class="lib"><div class="title" style="font-size:${Math.round(30*u)}px">Search</div>
          <div style="margin-top:${Math.round(20*u)}px;height:${Math.round(118*u*1.4)}px">${posters}</div>
          <div class="title" style="font-size:${Math.round(22*u)}px;margin-top:${Math.round(30*u)}px;color:#C9CCD3">Popular now</div>
          <div style="margin-top:${Math.round(16*u)}px">${covers(TVPOP,{w:Math.round(118*u),gap:Math.round(18*u),title:Math.round(14*u),plat:Math.round(10*u),max:7})}</div></div>
        <div style="position:absolute;left:${(iw-kbw2)/2}px;top:${ih-kbh2-Math.round(26*u)}px;width:${kbw2}px;height:${kbh2}px;overflow:hidden;border-radius:${Math.round(26*kz)}px;box-shadow:0 18px 48px rgba(0,0,0,.7)">
          <img src="${o.kb}" style="position:absolute;width:${kw*kz}px;left:${-x0*kz}px;top:${-y0*kz}px"></div></div></div>`; }
  else h=windowHtml(f,{kb:o.kb,curOn:o.curOn,pill:pillHtml(o.combo,o.comboAge,o.comboLeft)},ww,kw,kh);
  if(!tv&&o.combo&&OPT.combo==='below') h+=`<div class="abs" style="left:0;width:${W}px;top:${WY+winHeight(ww,kw,kh,false)+32}px;text-align:center">${pillHtml(o.combo,o.comboAge,o.comboLeft)}</div>`;
  h+=`<div class="abs" style="left:${WX}px;top:${ROW}px;height:${SH}px;display:flex;align-items:center">${capBlock(c,o.sec,{left:o.left})}</div>`;
  h+=`<div id="slot" class="abs m" style="left:${WX+WW-SW}px;top:${ROW-sp.extra}px;width:${SW}px;height:${SH+sp.extra}px;overflow:hidden;-webkit-mask-image:${sp.mask};-webkit-mask-composite:source-in;mask-image:${sp.mask};mask-composite:intersect">
    <div style="position:absolute;inset:0;opacity:${o.picAlpha};transform:scale(${o.picScale});transform-origin:50% 50%"><img src="${o.pic}" style="position:absolute;left:${sp.left}px;top:${sp.top}px;width:${pw*sp.z}px"></div></div>`;
  document.getElementById('scene').innerHTML=h; motion(o); await settle(); cropCheck();
  window.LAST={facePx:sp.facePx,whole:sp.whole,ww}; return true;
};
// A whole app screen (Settings, the tour, What's new), recorded at the Odin 2 Portal's size: the words on top, left-aligned
// with the screen, the screen 1440 px wide underneath
window.Screen=async function(o){
  backdrop(o.part,o.index);
  const c=words(o.cap,o)||['',''];
  if(o.cap==='sounds'){
    const cy0=290, cy1=736, sw=1600, sh=Math.round(sw*(cy1-cy0)/1654), x=(W-sw)/2, k=sw/1654, top=Math.round((H-(170+64+sh))/2), y=top+170+64;
    const t=ease(Math.min(1,(o.tagAge||0)/5)), pop=o.tag?`<div class="m" style="position:absolute;right:${x}px;top:${top-6}px;font-family:A;font-weight:700;font-size:64px;line-height:1;
      color:var(--paper);padding:18px 36px;border-radius:999px;box-shadow:inset 0 0 0 3px var(--teal);background:color-mix(in srgb, var(--teal) 10%, transparent);opacity:${t};transform:scale(${.9+.1*t});transform-origin:100% 50%">${esc(o.tag)}</div>`:'';
    document.getElementById('scene').innerHTML=`<div class="abs" style="left:${x}px;top:${top}px">${capBlock(c,o.sec,{left:o.left})}</div>${pop}
      <div class="shot m" style="left:${x}px;top:${y}px;width:${sw}px;height:${sh}px"><img src="${o.scr}" style="width:${sw}px;height:${Math.round(824*k)}px;margin-top:${-Math.round(cy0*k)}px"></div>`;
    await settle(); return true;
  }
  const sw=1440, sh=Math.round(sw*824/1654), x=(W-sw)/2, capH=148, gap=48, top=Math.round((H-(capH+gap+sh))/2);
  document.getElementById('scene').innerHTML=`<div class="abs" style="left:${x}px;top:${top}px">${capBlock(c,o.sec,{left:o.left})}</div>
    <div class="shot m" style="left:${x}px;top:${top+capH+gap}px;width:${sw}px;height:${sh}px"><img src="${o.scr}"></div>`;
  motion(o); await settle(); cropCheck(); return true;
};
// The nine sound packs, as a designed sequence (names and descriptions are the app's own, from SoundPack).
// One pack at a time gets the highlight; each landing is where its sound sample plays (see the cue sheet).
const PACKS=[['Soft','A gentle thud with a crisp click. The default'],['Thock','A deep, rounded mechanical key'],['Tactile','Dry, crisp switch clicks, no notes'],
  ['Typewriter','A metal strike, with a small bell on Enter'],['Felt','Very soft taps for playing at night'],['Chime','Wooden mallet notes'],
  ['Glass','Tiny tuned taps on glass'],['Pop','Round little drops, each on its own note'],['Retro','Short 8-bit blips, like a handheld’s menus']];
const PACK_LEAD=.5;                       // seconds before the first pack lights
const easeInOut=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
// where the highlight is at time s (seconds): a float pack index that glides 0.28 s between packs
function packAt(s,step){ if(s<PACK_LEAD) return {k:0,f:0,lit:ease(s/PACK_LEAD)}; const u=(s-PACK_LEAD)/step, k=Math.min(8,Math.floor(u)), r=(u-k)*step;
  return {k, f:k>=8?8:k+easeInOut((r-(step-.28))/.28)*((r>step-.28)?1:0), lit:1}; }
window.Packs=async function(o){
  backdrop(o.part,o.index);
  const s=o.sec, step=o.step||.9, P=packAt(s,step), cur=Math.round(P.f);
  let h='';
  if(o.style==='list'){
    // A: all nine on one Settings-style card, two groups; the highlight walks down the list
    const x=860, w=900, rowH=72, headH=60, top0=Math.round((H-(9*rowH+2*headH+48))/2);
    const yOf=k=>top0+24+headH+(k>=5?headH:0)+k*rowH;
    h+=`<div class="cap" style="left:120px;top:${top0+24}px;width:640px"><div class="h1 m">Nine sound packs, all remade</div><div class="body m">Pick yours in Settings → Sound & haptics.</div></div>`;
    h+=`<div class="abs m" style="left:${x}px;top:${top0}px;width:${w}px;height:${9*rowH+2*headH+48}px;background:var(--card);border-radius:22px;box-shadow:0 0 0 2px var(--track),0 24px 60px rgba(0,0,0,.45)"></div>`;
    h+=`<div class="abs label" style="left:${x+32}px;top:${top0+24+18}px;font-size:18px">Like real keys</div><div class="abs label" style="left:${x+32}px;top:${yOf(5)-headH+18}px;font-size:18px">Notes from one scale</div>`;
    const fy=P.f<5?yOf(0)+P.f*rowH:yOf(5)+(P.f-5)*rowH;            // glide (the gap between groups is crossed within one step)
    const hy=P.f>4&&P.f<5?yOf(4)+(P.f-4)*(yOf(5)-yOf(4)):fy;
    h+=`<div class="abs" style="left:${x+12}px;top:${hy+4}px;width:${w-24}px;height:${rowH-8}px;border-radius:18px;background:var(--raised);box-shadow:inset 0 0 0 3px rgba(${INLAY.rgb},${.95*P.lit})"></div>`;
    PACKS.forEach(([n,d],k)=>{ const on=k===cur&&P.lit>.5;
      h+=`<div class="abs" style="left:${x+40}px;top:${yOf(k)}px;width:${w-80}px;height:${rowH}px;display:flex;align-items:center;gap:24px">
        <div style="font-family:I;font-weight:600;font-size:30px;width:200px;color:${on?'var(--paper)':'#C9CCD3'}">${n}</div>
        <div style="font-family:I;font-size:21px;color:${on?'#C9CCD3':'#6B6E76'}">${d}</div></div>`; });
  } else {
    // B: one big card per pack, sliding along; neighbours wait dimmed at the sides
    const cw=820, ch=400, gap=60, cx=(W-cw)/2, cy=430;
    h+=`<div class="cap" style="left:0;width:${W}px;top:150px;text-align:center"><div class="h1 m">Nine sound packs, all remade</div><div class="body m">Pick yours in Settings → Sound & haptics.</div></div>`;
    PACKS.forEach(([n,d],k)=>{ const off=k-P.f, x=cx+off*(cw+gap); if(x<-cw||x>W) return;
      const near=Math.max(0,1-Math.abs(off)), sc=.86+.14*near, op=.35+.65*near;
      h+=`<div class="abs" style="left:${x}px;top:${cy}px;width:${cw}px;height:${ch}px;transform:scale(${sc});opacity:${op};border-radius:28px;background:var(--card);
        box-shadow:0 0 0 2px var(--track)${near>.5?`,inset 0 0 0 3px rgba(${INLAY.rgb},${(near*P.lit).toFixed(2)})`:''},0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center;padding:0 64px">
        <div class="label" style="font-size:18px">${k<5?'Like real keys':'Notes from one scale'} · ${k+1} of 9</div>
        <div class="h1" style="font-size:96px;margin-top:18px">${n}</div><div class="body" style="font-size:30px;margin-top:16px;color:#C9CCD3">${d}</div></div>`; });
  }
  document.getElementById('scene').innerHTML=h; await settle(); return true;
};
// Title and end cards. sec = seconds since the card started.
// The end card builds in three steps (logo, line, link): each fades in while rising 16 px, 0.5 s, ease-out, 0.25 s apart.
window.Card=async function(kind,sec,index,o={}){
  backdrop(kind,index);
  const a=ease(sec/.4), st=k=>{ const t=ease((sec-k*.25)/.5); return `opacity:${t};transform:translateY(${(1-t)*16}px)`; };
  const head=s=>`<div class="h1 m" style="font-size:84px;margin-top:56px;text-wrap:balance;opacity:${a}">${s}</div>`;
  const sub=(s,mt=28,col='#C9CCD3')=>`<div class="body m" style="font-size:34px;margin-top:${mt}px;color:${col};opacity:${a}">${s}</div>`;
  const L=160, logo=`<div style="height:${L}px;opacity:${a}">${LOGO(L)}</div>`;
  const html=kind==='intro'
    ? `${logo}${head('Type with your <span style="color:var(--teal)">controller</span>')}${sub('A free keyboard for Android handhelds, controllers and TV.')}`
    : kind==='new'
    ? `${logo}<div class="tag m" style="margin-top:56px;opacity:${a}">NEW IN ${esc(o.version||'')}</div>${head(esc(o.title||''))}`
    : OPT.end==='A'||OPT.end==='B'?typedEnd(sec,L):endCard(sec, L);
  document.getElementById('scene').innerHTML=kind==='outro'&&(OPT.end==='A'||OPT.end==='B')?html:`<div class="card" style="text-align:center;padding:0 160px">${html}</div>`;
  motion({gsec:o.gsec}); await settle(); cropCheck(); return true;
};
// The end card (chosen 27 Oct: 3, side by side): the logo, the divider, then "Free and open source.", "No ads.",
// "No tracking." one by one, the link last, one beat each (0.65 s apart, Emre: "beat for beat", not rushed). Each piece
// fades in while rising 16 px (0.5 s, ease-out); everything is in by 3.1 s and the card holds 1.5 s more (4.6 s in all).

// The typed end card (round V7, 31 Oct 2026): the logo types itself (the brand's logo animation, tools/brand/logo_motion.py,
// as renders/logo-anim.js from logo-anim.py), then the three lines are typed after it with the field's cursor, the link
// last. A: everything centred, the logo moving up to make room; B: the approved side-by-side layout, typed.
// the end card's words (round V8 tagline options): lines typed (segments: [text, teal?]) and a quieter line that fades in
const END_TAGS={
  T0:{lines:[[['Free and ',0],['open source.',1]],[['No ads.',0]],[['No internet access.',0]]]},
  A:{lines:[[['Type with your ',0],['controller.',1]]],small:'Free, open source and offline.'},
  B:{lines:[[['Free. Open source. ',0],['Offline.',1]]]},
  C:{lines:[[['No ads. No accounts. ',0],['No internet.',1]]]}};
const TAG=()=>END_TAGS[OPT.tag||'T0'], END_LINES_=()=>TAG().lines;
const CPS=.04, LINE_PAUSE=.3;                       // 40 ms a letter, a short beat at each line's end
function typedEnd(sec,L){
  const A=LOGO_ANIM, fi=Math.floor(sec*A.fps), logoDone=A.frames.length/A.fps;
  const logoSvg=(fi<A.frames.length?A.frames[fi]:A.rest).replace('<svg ',`<svg style="display:block;height:${L}px;width:auto" `);
  const move=OPT.end==='A'?easeIO((sec-logoDone+.2)/.5):1;           // A: the logo rises into place as the typing starts
  const t0=logoDone+(OPT.end==='A'?.15:0);                           // the lines start as the logo settles
  // how many letters of each line are typed at sec
  let t=t0, cur=null; const END_LINES=END_LINES_(); const shown=END_LINES.map((segs,li)=>{ const n=segs.reduce((a,x)=>a+x[0].length,0), k=Math.max(0,Math.min(n,Math.floor((sec-t)/CPS)+1)); const started=sec>=t;
    if(started&&(k<n||cur===null)) cur=li; const done=sec>=t+n*CPS; t+=n*CPS+LINE_PAUSE; return {segs,k:started?k:0,started,done}; });
  const allDone=sec>=t-LINE_PAUSE, linkAt=t-LINE_PAUSE+.25, fs=56, ch=Math.round(fs*1.05);
  const caretOn=!allDone&&cur!==null;
  const line=(r,li)=>{ let left=r.k, h=''; for(const [txt,teal] of r.segs){ const part=txt.slice(0,Math.max(0,left)); left-=txt.length; if(part) h+=teal?`<span style="color:var(--teal)">${esc(part)}</span>`:esc(part); }
    const c=caretOn&&li===cur?`<span style="display:inline-block;width:0;height:${ch}px;vertical-align:${-Math.round(ch*.18)}px;position:relative"><span style="position:absolute;left:3px;top:0;width:4px;height:${ch}px;border-radius:2px;background:var(--teal)"></span></span>`:'';
    // the whole line sits in place, invisible, and the typed part is drawn over it: letters never shift as they arrive
    const full=r.segs.map(x=>esc(x[0])).join('');
    return `<div class="h1" style="font-size:${fs}px;line-height:1.3;height:${Math.round(fs*1.3)}px;white-space:pre"><span style="position:relative;display:inline-block"><span style="visibility:hidden">${full}</span><span style="position:absolute;left:0;top:0">${h}${c}</span></span></div>`; };
  const lt=ease((sec-linkAt)/.5), st=ease((sec-linkAt+.15)/.5), small=TAG().small?`<div class="body" style="font-size:36px;font-weight:500;margin-top:20px;color:#E3E6EB;opacity:${st};transform:translateY(${((1-st)*16).toFixed(1)}px)">${esc(TAG().small)}</div>`:'';
  const link=`${small}<div class="body" style="font-size:30px;margin-top:${small?36:28}px;color:#9A9DA5;opacity:${lt};transform:translateY(${((1-lt)*16).toFixed(1)}px)">github.com/dakingeman/inlay</div>`;
  const lines=shown.map(line).join('');
  if(OPT.end==='A'){ // centred: the logo alone in the middle, then it rises and the lines type underneath
    const blockH=L+64+END_LINES.length*Math.round(fs*1.3)+(TAG().small?20+48+36:28)+40, top0=(H-L)/2, top1=(H-blockH)/2, top=top0+(top1-top0)*move;
    return `<div class="abs" style="left:0;width:${W}px;top:${top}px;display:flex;flex-direction:column;align-items:center">
      <div class="m" style="height:${L}px">${logoSvg}</div><div style="height:64px"></div>
      <div style="text-align:center;opacity:${sec>=t0?1:0}">${lines}</div>${link}</div>`; }
  // B: side by side, as the approved end card, but typed
  return `<div class="abs" style="inset:0;display:flex;align-items:center;justify-content:center;gap:72px"><div class="m" style="height:${L}px">${logoSvg}</div>
    <div style="width:2px;height:300px;background:var(--track);opacity:${ease((sec-logoDone+.3)/.4)}"></div><div style="width:620px">${lines}${link}</div></div>`;
}
window.END=+(Q.get('end')||3);
function endCard(sec,L){
  const at=d=>{ const t=ease((sec-d)/.5); return `opacity:${t};transform:translateY(${(1-t)*16}px)`; };
  const P=['Free and open source.','No ads.','No internet access.'], D=[.6,1.25,1.9], link=2.6;
  const lnk=(mt,fs=32)=>`<div class="body m" style="font-size:${fs}px;margin-top:${mt}px;color:#C9CCD3;${at(link)}">github.com/dakingeman/inlay</div>`;
  if(END===1) // stacked: three big lines under the logo
    return `<div style="height:${L}px;${at(0)}">${LOGO(L)}</div><div style="margin-top:64px">${P.map((p,k)=>`<div class="h1 m" style="font-size:60px;line-height:1.25;${at(D[k])}">${p}</div>`).join('')}</div>${lnk(48)}`;
  if(END===2) // one line, the phrases joining it one by one, "open source" in teal (the one teal word, as in the hero)
    return `<div style="height:${L}px;${at(0)}">${LOGO(L)}</div><div class="h1 m" style="font-size:60px;margin-top:72px;white-space:nowrap">${
      [`Free and <span style="color:var(--teal)">open source.</span>`,'No ads.','No tracking.'].map((p,k)=>`<span style="display:inline-block;${at(D[k])}">${p}</span>`).join('&nbsp; ')}</div>${lnk(40)}`;
  // 3: split. Logo on the left, the three lines on the right of a thin divider, link under them
  return `<div style="display:flex;align-items:center;gap:72px;text-align:left"><div style="height:${L}px;${at(0)}">${LOGO(L)}</div>
    <div style="width:2px;height:300px;background:var(--track);${at(.25)}"></div><div>${P.map((p,k)=>`<div class="h1 m" style="font-size:56px;line-height:1.3;${at(D[k])}">${k===0?'Free and <span style="color:var(--teal)">open source.</span>':p}</div>`).join('')}${lnk(28,30)}</div></div>`;
}
document.fonts.ready.then(()=>document.title='done');
</script></body></html>
