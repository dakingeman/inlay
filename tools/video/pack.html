<html><head><meta charset="utf-8"><style>

2Z"/></g></svg>`;</script><script src="spotlight4.js" charset="utf-8"></script></head><body>
<div class="card" id="hero"></div><div class="card" id="typing"></div><div class="card" id="editing"></div><div class="card" id="hold"></div>
<div class="card" id="looks"></div><div class="card" id="icons"></div><div class="card" id="clipboard"></div><div class="card" id="rightstick"></div><div class="card" id="controls"></div>
<script>
document.fonts.load('500 30px I').then(()=>document.fonts.ready).then(()=>{
const $=id=>document.getElementById(id); const ACC='#72D6E8';
const kbBox=(svg,w)=>svg.replace('<svg ',`<svg style="width:${w}px;height:auto;display:block" `);
const COVERS=['#1d3557','#e63946','#2a9d8f','#e9c46a','#6d597a','#f4a261','#264653','#8ab17d'];
const app=(w,h,{title,text,sel,cursor,covers=8,extra=''})=>`<div style="position:absolute;inset:0;background:linear-gradient(160deg,#151a24,#0b0d12)">
  <div style="position:absolute;left:5%;top:6%;font-family:A;font-weight:700;font-size:${h*.075}px">${title}</div>
  <div class="field" style="position:absolute;left:5%;top:18%;width:62%;height:11%;font-size:${h*.05}px;white-space:pre">${sel?text.slice(0,sel[0])+`<span style="background:${ACC}66;border-radius:4px">${text.slice(sel[0],sel[1])}</span>`+text.slice(sel[1]):(cursor!=null?text.slice(0,cursor)+'<span class="caret"></span>'+text.slice(cursor):text+'<span class="caret"></span>')}</div>${extra}
  <div style="position:absolute;left:5%;top:36%;display:flex;gap:1.8%;width:100%">${COVERS.slice(0,covers).map(c=>`<div style="flex:none;width:10.5%;height:${h*.3}px;border-radius:${h*.02}px;background:${c};opacity:.9"></div>`).join('')}</div></div>`;
const screen=(x,y,w,h,inner,kbo)=>`<div class="scr" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${inner}<div style="position:absolute;left:0;right:0;bottom:0">${kbBox(kb(Object.assign({W:1280,S:2},kbo)),w)}</div></div>`;
const ctl=(x,y,w,on,style)=>`<div class="k" style="left:${x}px;top:${y}px;width:${w}px">${controller(w,on||{},style||'xbox')}</div>`;
const head=(t,p)=>`<div class="k" style="left:80px;top:64px;width:1440px"><div class="h">${t}</div><div class="p">${p}</div></div>`;
const prompt=(x,y,btns,label,style)=>`<div class="k prompt" style="left:${x}px;top:${y}px;width:560px">${btns.map(b=>bigBadge(b,52,style||'xbox')).join('<span style="color:#9A9DA5;margin:0 6px">+</span>')}<span style="margin-left:6px">${label}</span></div>`;

// Hero: logo, tagline, then the product shot. One centred column of text, a clear 72 px gap,
// then the screen and controller as one group, centred, with even margins all round.
{
  const W=800, H=Math.round(W*9/16), GAP=80, CW=340, X0=Math.round((1600-(W+GAP+CW))/2), Y=384;
  const results=[['The Legend of Zelda: Breath of the Wild','#2a9d8f'],['Zelda II: The Adventure of Link','#e63946']];
  const scene=`<div style="position:absolute;inset:0;background:linear-gradient(160deg,#151a24,#0b0d12)">
    <div style="position:absolute;left:5%;top:7%;font-family:A;font-weight:700;font-size:${H*.072}px">Games</div>
    <div style="position:absolute;left:5%;right:5%;top:19%;height:${H*.11}px;box-sizing:border-box;background:#1b2130;border:1px solid #ffffff1a;border-radius:12px;display:flex;align-items:center;padding:0 18px;font-size:${H*.046}px">
      <span>zelda</span><span style="width:2px;height:${H*.055}px;background:${ACC};margin-left:3px"></span>
      <span style="margin-left:auto;padding-left:24px;font-size:${H*.036}px;color:#9A9DA5;white-space:nowrap">2 results</span></div>
    <div style="position:absolute;left:5%;right:5%;top:34%;display:flex;flex-direction:column;gap:${H*.016}px">${results.map(([t,c])=>`
      <div style="display:flex;align-items:center;gap:14px;font-size:${H*.036}px;color:#C9CCD3"><div style="width:${H*.05}px;height:${H*.05}px;border-radius:6px;background:${c};flex:none"></div><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span></div>`).join('')}</div></div>`;
  $('hero').innerHTML=`<div class="k" style="left:0;right:0;top:56px;text-align:center">
      <div style="width:460px;margin:0 auto">${LOCKUP}</div>
      <div style="font-size:46px;font-weight:500;color:#D5D8DE;margin-top:18px;letter-spacing:-.2px">A gamepad keyboard for Android handhelds</div></div>`+
    screen(X0,Y,W,H,scene,{glide:{from:[2,0],to:[2,0],p:1},focus:[2,0],selectBadge:true})+
    ctl(X0+W+GAP,Y+Math.round((H-CW*0.644)/2)-10,CW,{A:1});
}
$('typing').innerHTML=head('Move with the D-pad, type with A','Y is space, X deletes, Start goes. Up and down remember your column, so the highlight never guesses.')+
  screen(80,260,980,551,app(980,551,{title:'Games',text:'metroi'}),{focus:[2,2]})+ctl(1100,330,430,{Dleft:1})+prompt(1035,740,['DPAD'],'Move');
$('editing').innerHTML=head('Edit text properly','Select a word, delete it, undo it, copy it. Cut, Copy and Paste sit in the top row.')+
  screen(80,260,980,551,app(980,551,{title:'Games',text:'metroid prime',sel:[8,13]}),{focus:[2,4],selecting:true})+ctl(1100,330,430,{RT:1,LB:1})+prompt(1035,740,['RT','LB'],'Select the word');
$('rightstick').innerHTML=head('The right stick moves the cursor','Push it sideways and the further you push, the faster it goes. Hold RT for whole words. In select mode it grows the selection.')+
  screen(80,260,980,551,app(980,551,{title:'Games',text:'metroid prime',cursor:7}),{focus:[2,4]})+ctl(1100,330,430,{RS:1,RSdir:'sideways'})+prompt(1035,740,['RS'],'Move the cursor');
{
  // Button map: the same rows as Settings → Button guide, badges first, words after a 24 px gap
  const row=(btns,label)=>`<div class="mrow"><div class="mb">${btns.map(b=>b==='+'?'<span style="color:#9A9DA5;margin:0 4px">+</span>':b==='/'?'<span style="color:#9A9DA5;margin:0 2px">/</span>':bigBadge(b,34)).join('')}</div><div class="mt">${label}</div></div>`;
  const col=(title,rows)=>`<div class="mcol"><div class="mh">${title}</div>${rows.join('')}</div>`;
  $('controls').innerHTML=head('Every button has a job','The full button map. Settings → Button guide shows the same list, in your controller\'s icons.')+
    `<style>.mcol{width:520px}.mh{font-size:17px;font-weight:600;letter-spacing:1.5px;color:#72D6E8;text-transform:uppercase;margin-bottom:6px}
     .mrow{display:flex;align-items:center;min-height:52px;font-size:22px;color:#E6E8EC}.mb{flex:none;display:flex;align-items:center;gap:6px}.mt{white-space:nowrap}</style>`+
    `<div class="k" id="mapcols" style="left:80px;top:250px;display:flex;gap:64px">`+
    col('Typing',[row(['DPAD'],'Move the highlight (or the left stick)'),row(['A'],'Type the highlighted key'),row(['X'],'Delete · hold to speed up'),row(['Y'],'Space'),
      row(['RT'],'Shift · tap twice for caps lock'),row(['LT'],'Symbols and numbers'),row(['START'],'Enter · Search · Go'),row(['B'],'Close the keyboard'),row(['LS'],'Press: keyboard size')])+
    col('Editing',[row(['LB','RB'],'Move the text cursor'),row(['RS'],'Or the right stick · push further, go faster'),row(['SELECT'],'Select text · twice: everything'),
      row(['RT','+','LB','RB'],'Jump a whole word'),row(['RT','+','RS'],'Jump words with the stick'),row(['RT','+','A'],'One capital letter'),row(['RT','+','Y'],'Accent the last letter'),row(['RT','+','X'],'Undo'),row(['RT','+','LT'],'Switch language')])+
    `</div>`;
  // Each column's badges get the width of its widest row plus 24 px of air before the words
  document.querySelectorAll('#controls .mcol').forEach(c=>{const bs=[...c.querySelectorAll('.mb')];const w=Math.max(...bs.map(b=>b.scrollWidth))+24;bs.forEach(b=>b.style.width=w+'px');c.style.width='auto';});
}
$('hold').innerHTML=head('Hold RT for more','Tips appear on the keyboard while you hold it: a capital letter, word jumps, accents, undo. Nothing to memorise.')+
  screen(80,260,980,551,app(980,551,{title:'Games',text:'cafe'}),{focus:[1,2],held:true,shift:'once',chips:[[{b:"LB"},{b:"RB"},{t:"Jump word"}],[{b:"A"},{t:"Capital"}],[{b:"Y"},{t:"Accent"}],[{b:"X"},{t:"Undo"}]]})+ctl(1100,330,430,{RT:1,Y:1})+prompt(1035,740,['RT','Y'],'Accent: e becomes é');
const looks=[['Light',{theme:'Light',accent:'#4FA8FF'}],['Outline',{theme:'Outline',accent:'#FFC857'}],['Clear',{theme:'Clear',accent:ACC,behind:(W,H)=>`<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f3f6e"/><stop offset=".55" stop-color="#a65a3b"/><stop offset="1" stop-color="#d9b25c"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#gg)"/>`+COVERS.map((c,i)=>`<rect x="${30+i*160}" y="30" width="135" height="420" rx="16" fill="${c}"/>`).join('')}],
  ['Coral highlight',{accent:'#FF8A80'}],['Round keys',{corner:14}],['Classic layout',{layout:'classic'}]];
$('looks').innerHTML=head('Make it look how you want','Twelve themes, sixteen highlight colours plus any custom colour, three key shapes, two layouts, three sizes.')+
  looks.map(([n,o],i)=>`<div class="k" style="left:${80+(i%3)*490}px;top:${250+Math.floor(i/3)*300}px;width:460px">${kbBox(kb(Object.assign({W:1280,S:2,focus:[2,4]},o)),460)}<div class="mini">${n}</div></div>`).join('');
const styles=[['xbox','Xbox'],['ps','PlayStation'],['switch','Switch']];
$('icons').innerHTML=head('Icons for your controller','Pick Xbox, PlayStation or Switch and every hint in the app follows, on the keys and in Settings.')+
  styles.map(([s,n],i)=>`<div class="k" style="left:${80+i*490}px;top:260px;width:460px">${kbBox(kb({W:1280,S:2,focus:[2,4],style:s}),460)}<div style="display:flex;justify-content:center;gap:10px;margin-top:22px">${['A','B','X','Y','LB','RT'].map(b=>bigBadge(b,46,s)).join('')}</div><div class="mini">${n}</div></div>`).join('')+
  ctl(130,560,400,{},'xbox')+ctl(620,560,400,{},'ps')+ctl(1110,560,400,{},'switch');
const clips=['github.com/dakingeman/inlay','metroid prime','Odin 2 Portal','save state slot 3'];
$('clipboard').innerHTML=head('Clipboard history','Your last six copies, one button away. Anything a password manager marks as sensitive is never kept.')+
  `<div class="scr" style="left:80px;top:260px;width:980px;height:551px">${app(980,551,{title:'Games',text:'zelda'})}<div style="position:absolute;left:0;right:0;bottom:0;background:#000;padding:12px 12px 14px"><div style="display:flex;gap:10px;margin-bottom:10px;padding:0 4px;font-size:19px;color:#9A9DA5"><span style="flex:1.9;text-align:center">Select</span><span style="flex:1.2;text-align:center">Cut</span><span style="flex:1.3;text-align:center">Copy</span><span style="flex:3.8;text-align:center">Paste</span><span style="flex:.9;text-align:center;color:${ACC}">⏱</span><span style="flex:.9;text-align:center">⚙</span></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${clips.map((c,i)=>`<div style="height:54px;border-radius:14px;background:${i==0?ACC:'#1B1B1F'};color:${i==0?'#0B0F17':'#F2F3F5'};display:flex;align-items:center;padding:0 18px;font-size:21px;box-shadow:${i==0?'0 0 0 3px '+ACC+'59':'none'}">${c}</div>`).join('')}</div>
   <div class="prompt" style="margin-top:12px;font-size:17px;gap:8px">${bigBadge('A',30)} Paste <span style="width:14px"></span>${bigBadge('X',30)} Remove <span style="width:14px"></span>${bigBadge('B',30)} Back</div></div></div>`+ctl(1100,330,430,{A:1});
});
</script></body></html>
