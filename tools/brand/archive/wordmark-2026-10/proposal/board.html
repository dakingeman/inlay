<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f5f5f7;font-family:sans-serif;padding:16px;width:1240px}
h1{font:700 22px sans-serif;margin:0 0 4px}h2{font:700 15px sans-serif;margin:18px 0 6px}p{color:#555;font-size:13px;margin:0 0 8px}
.row{display:flex;gap:14px;flex-wrap:wrap}.pan{border-radius:12px;padding:26px;display:flex;align-items:center;justify-content:center}
.dk{background:#0B0B0E}.lt{background:#fff;box-shadow:inset 0 0 0 1px #ddd}.gh{background:#0d1117}
.sizes{flex-direction:column;align-items:flex-start}.sizes img{display:block;margin:6px 0}.blur img{filter:blur(2.2px)}
</style></head><body>
<h1>Wordmark: typing (in|lay) and final (inlay|)</h1><p>Drawn as shapes from Atkinson Hyperlegible Next Bold. Shown at real file size.</p>
<h2>Lockups</h2><div class="row">
<div class="pan dk"><img src="inlay-lockup-typing-dark.svg" height="120"></div><div class="pan lt"><img src="inlay-lockup-typing-light.svg" height="120"></div>
<div class="pan dk"><img src="inlay-lockup-dark.svg" height="120"></div><div class="pan lt"><img src="inlay-lockup-light.svg" height="120"></div></div>
<h2>Small sizes (lockup 120, 64, 40, 28 px tall; wordmark alone 24, 16 px)</h2><div class="row">
<div class="pan dk sizes"><img src="inlay-lockup-typing-dark.svg" height="64"><img src="inlay-lockup-typing-dark.svg" height="40"><img src="inlay-lockup-typing-dark.svg" height="28"><img src="inlay-wordmark-typing-dark.svg" height="24"><img src="inlay-wordmark-typing-dark.svg" height="16"></div>
<div class="pan dk sizes"><img src="inlay-lockup-dark.svg" height="64"><img src="inlay-lockup-dark.svg" height="40"><img src="inlay-lockup-dark.svg" height="28"><img src="inlay-wordmark-dark.svg" height="24"><img src="inlay-wordmark-dark.svg" height="16"></div>
<div class="pan lt sizes"><img src="inlay-lockup-typing-light.svg" height="64"><img src="inlay-lockup-typing-light.svg" height="40"><img src="inlay-wordmark-typing-light.svg" height="24"><img src="inlay-wordmark-typing-light.svg" height="16"></div>
<div class="pan lt sizes"><img src="inlay-lockup-light.svg" height="64"><img src="inlay-lockup-light.svg" height="40"><img src="inlay-wordmark-light.svg" height="24"><img src="inlay-wordmark-light.svg" height="16"></div></div>
<h2>One colour, squint test (blurred), and on GitHub dark</h2><div class="row">
<div class="pan lt"><img src="inlay-wordmark-black.svg" height="60"></div><div class="pan dk"><img src="inlay-wordmark-white.svg" height="60"></div>
<div class="pan dk blur"><img src="inlay-lockup-typing-dark.svg" height="80"></div><div class="pan gh"><img src="inlay-lockup-typing-dark.svg" height="80"></div></div>
</body></html>
